services:
  mab-website:
    build:
      context: .
      dockerfile: Dockerfile
    image: mab-website:latest
    container_name: mab-website
    restart: unless-stopped

    # Só expor a 127.0.0.1 (não público) — Cloudflare Tunnel chega pela rede interna
    ports:
      - "127.0.0.1:3000:3000"

    environment:
      ADMIN_USERNAME:    ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD:    ${ADMIN_PASSWORD:-mab2026}
      ADMIN_SESSION_KEY: ${ADMIN_SESSION_KEY:-CHANGE-ME-IN-PRODUCTION}
      NODE_ENV: production

    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads

    networks:
      - default        # rede própria deste compose
      - cloudflared    # rede partilhada com o cloudflared

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  cloudflared:
    external: true       # rede criada por outro compose (do cloudflared)
    # Se o nome não for "cloudflared", muda na linha de baixo:
    # name: NOME_REAL_DA_REDE
