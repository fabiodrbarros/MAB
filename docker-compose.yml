services:
  mab-website:
    build:
      context: .
      dockerfile: Dockerfile
    image: mab-website:latest
    container_name: mab-website
    restart: unless-stopped

    # Sem mapeamento público de portas — Cloudflare Tunnel acede via rede 'web'
    # Se quiseres testar localmente na VPS, descomenta:
    # ports:
    #   - "127.0.0.1:3000:3000"

    environment:
      ADMIN_USERNAME:    ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD:    ${ADMIN_PASSWORD:-mab2026}
      ADMIN_SESSION_KEY: ${ADMIN_SESSION_KEY:-CHANGE-ME-IN-PRODUCTION}
      NODE_ENV: production

    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads

    networks:
      - default       # rede deste compose
      - web           # rede partilhada com cloudflared + outros apps

    healthcheck:
      # Usar 127.0.0.1 explícito (evita resolver para ::1 em IPv6)
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  web:
    external: true       # rede já existente (criada pelo nginx-proxy-manager ou cloudflared)
