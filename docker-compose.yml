services:
  mab-website:
    build:
      context: .
      dockerfile: Dockerfile
    image: mab-website:latest
    container_name: mab-website
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      # Sessão admin — DEFINIR EM .env (não comitar!)
      ADMIN_USERNAME:    ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD:    ${ADMIN_PASSWORD:-mab2026}
      ADMIN_SESSION_KEY: ${ADMIN_SESSION_KEY:-CHANGE-ME-IN-PRODUCTION}

      NODE_ENV: production

    volumes:
      # Persistência dos JSON (propriedades + projetos)
      - ./data:/app/data

      # Persistência das imagens carregadas pelo admin
      - ./public/uploads:/app/public/uploads

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
